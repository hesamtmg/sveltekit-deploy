server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;
	index index.html;

	# Prerendered SvelteKit routes are emitted as "<route>.html" (e.g. success.html).
	# Resolve a clean URL by trying the exact file, then the same path with .html appended.
	location / {
		try_files $uri $uri.html $uri/ =404;
	}

	# Hashed, immutable build assets can be cached forever.
	location /_app/immutable/ {
		expires 1y;
		add_header Cache-Control "public, immutable";
		try_files $uri =404;
	}

	gzip on;
	gzip_types text/plain text/css application/javascript application/json image/svg+xml;
	gzip_min_length 512;

	add_header X-Frame-Options "SAMEORIGIN" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
